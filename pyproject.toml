[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-post"
version = "0.1.0"
description = "Bitbucket Pipelines results as a vintage horse-racing sports page."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "pipeline-post contributors" }]

[project.scripts]
pipeline-post = "pipeline_post.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline_post"]
